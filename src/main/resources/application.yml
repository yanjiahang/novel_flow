server:
  port: 8082
  tomcat:
    max-swallow-size: -1
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

novel:
  workspace: ./novel-projects
  allowed-extensions: txt,md,epub
  agent:
    memory:
      enabled: true
      user-id: local-user
      embedding-dimensions: 1536
      inject-limit: 6
      search-limit: 8
      duplicate-score-threshold: 0.92
  graph:
    checkpoint:
      saver: redis # redis 或 file；本地 Redis 容器关闭时可改为 file
      redis:
        address: redis://localhost:6379
        password:
        database: 0
        connection-pool-size: 16
        connection-minimum-idle-size: 4
        timeout-ms: 3000
  translation:
    base-url: http://localhost:11434
    model: hf.co/SakuraLLM/Sakura-7B-Qwen2.5-v1.0-GGUF:latest
    temperature: 0.1
    top-p: 0.3
    num-ctx: 8192
    num-gpu: 999
    num-predict: 1536
    chunk-size: 1200
    glossary-path: ./config/novel-glossary.json
    context-source-chars: 800
    context-translation-chars: 800
    review-enabled: true
    review-mode: chapter # chapter / chunk / both / none
    fix-enabled: true
    review-max-chars: 1800
    chapter-review-max-chars: 200000
    timeout-ms: 300000

# Spring AI ChatModel 配置：NovelFlow Supervisor Agent / 审校修订使用 DashScope
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
      file-size-threshold: 2MB
  ai:
    model:
      chat: dashscope
      embedding: dashscope
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      api-key: ${AI_DASHSCOPE_API_KEY:${DASHSCOPE_API_KEY:}}
      chat:
#        base-url: https://dashscope.aliyuncs.com
#        completions-path: /api/v1/services/aigc/text-generation/generation
        options:
          model: qwen3.6-max-preview
          temperature: 0.1
          top-p: 0.7
          max-tokens: 64000
          enable-thinking: false
          incremental-output: true
          timeout: 600000
      embedding:
        enabled: true
        options:
          model: text-embedding-v4
          dimensions: 1536
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3.5:4b
          temperature: 0.1
          top-p: 0.7
          num-ctx: 8192
          num-predict: 2048
    retry:
      max-attempts: 3  # 最大重试次数
      backoff:
        initial-interval: 2000  # 初始重试间隔2秒
        multiplier: 2  # 重试间隔倍数
        max-interval: 10000  # 最大重试间隔10秒
  datasource:
#    url: jdbc:postgresql://localhost:5432/robot
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:postgresql://localhost:5432/robot # 数据库连接 URL
    username: postgres
    password: postgres
    hikari: # HikariCP 连接池配置
      pool-name: AI-Robot-HikariCP # 自定义连接池名称
      auto-commit: true # 是否自动提交事务
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 600000 # 空闲连接存活最大时间（毫秒）
      max-lifetime: 1800000 # 连接最大存活时间（毫秒）
      minimum-idle: 5 # 最小空闲连接数
      maximum-pool-size: 20 # 最大连接池大小
      connection-test-query: SELECT 1 # 连接测试查询
      validation-timeout: 5000 # 验证连接的有效性
